<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <title>متجر الأدوات المنزلية</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🛒 متجر الأدوات المنزلية</h1>
    <button id="cart-toggle" class="cart-btn">السلة <span id="cart-count">0</span></button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>الأقسام</h2>
      <ul id="categories" class="categories"></ul>
      <input id="search" type="search" placeholder="ابحث عن منتج..." />
    </aside>

    <section class="catalog">
      <div id="products" class="products-grid"></div>
    </section>
  </main>

  <div id="product-modal" class="modal hidden">
    <div class="modal-box" id="modal-content"></div>
  </div>

  <div id="cart-panel" class="cart-panel hidden">
    <div class="cart-header">
      <h2>سلة التسوق</h2>
      <button id="cart-close">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <strong>الإجمالي: <span id="cart-total">0</span> د.إ</strong>
      <button id="checkout" class="checkout-btn">إتمام الشراء</button>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
